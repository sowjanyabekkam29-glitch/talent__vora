
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | TalentVora</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="auth">

        <h1>✦ TalentVora</h1>

        <p style="text-align:center">
            Join our creative community!
        </p>

        <h2>Create Account</h2>

        <form id="registerForm">

            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required
                minlength="2"
            >

            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                placeholder="Choose a username"
                required
                minlength="3"
                pattern="[A-Za-z0-9_]+"
            >

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>

            <div class="password-box">
                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    minlength="8"
                    required
                >

                <button
                    type="button"
                    onclick="togglePasswordField('password', this)"
                    aria-label="Show password"
                >👁</button>
            </div>

            <label for="confirmPassword">Confirm Password</label>

            <div class="password-box">
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    minlength="8"
                    required
                >

                <button
                    type="button"
                    onclick="togglePasswordField('confirmPassword', this)"
                    aria-label="Show confirm password"
                >👁</button>
            </div>

            <label>
                <input
                    type="checkbox"
                    id="terms"
                    required
                    style="width:auto"
                >
                I agree to the Terms and Conditions.
            </label>

            <button type="submit" class="primary">
                Create Account
            </button>

            <p id="registerMessage" role="status"></p>

        </form>

        <p style="text-align:center">
            Already have an account?
            <a href="login.html">Login here</a>
        </p>

        <p style="text-align:center">
            <a href="index.html">Back to Start</a>
        </p>

    </div>

    <script src="script.js"></script>

    <script>
        function togglePasswordField(id, button) {
            const field = document.getElementById(id);

            if (field.type === "password") {
                field.type = "text";
                button.textContent = "🙈";
            } else {
                field.type = "password";
                button.textContent = "👁";
            }
        }

        document.getElementById("registerForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const name =
                    document.getElementById("name").value.trim();

                const username =
                    document.getElementById("username").value.trim();

                const email =
                    document.getElementById("email").value.trim();

                const password =
                    document.getElementById("password").value;

                const confirmPassword =
                    document.getElementById("confirmPassword").value;

                const message =
                    document.getElementById("registerMessage");

                if (password !== confirmPassword) {
                    message.textContent = "Passwords do not match!";
                    message.style.color = "red";
                    return;
                }

                const accounts = JSON.parse(
                    localStorage.getItem("tvAccounts") || "[]"
                );

                const alreadyExists = accounts.some(account =>
                    account.email.toLowerCase() === email.toLowerCase() ||
                    (account.username &&
                    account.username.toLowerCase() === username.toLowerCase())
                );

                if (alreadyExists) {
                    message.textContent =
                        "Email or username already exists. Please login.";
                    message.style.color = "red";
                    return;
                }

                // Demo only: never store real passwords in localStorage.
                accounts.push({
                    name: name,
                    username: username,
                    email: email,
                    password: password
                });

                localStorage.setItem(
                    "tvAccounts",
                    JSON.stringify(accounts)
                );

                message.style.color = "green";
                message.textContent =
                    "Registration successful! Opening login page...";

                setTimeout(() => {
                    window.location.href = "login.html";
                }, 1000);
            });
    </script>

</body>
</html>
