<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TalentVora | My Profile</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff8e8;
      color: #390d1b;
    }

    header {
      background: #390d1b;
      color: #ffd700;
      padding: 18px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    header h2 {
      margin: 0;
    }

    header a {
      color: #ffd700;
      text-decoration: none;
      margin-right: 12px;
    }

    .container {
      max-width: 850px;
      margin: 28px auto;
      padding: 16px;
    }

    .profile-card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 5px 20px #390d1b18;
    }

    .cover {
      height: 150px;
      background: linear-gradient(135deg, #800020, #390d1b);
    }

    .profile-content {
      padding: 25px;
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #d4af37;
      background: #fff8e8;
      margin-top: -80px;
    }

    h1, h2 {
      color: #800020;
    }

    .subtitle {
      color: #755b61;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 22px 0;
    }

    .stat {
      background: #fff8e8;
      padding: 15px 8px;
      border-radius: 10px;
      text-align: center;
      border-bottom: 3px solid #d4af37;
    }

    .stat strong {
      display: block;
      color: #800020;
      font-size: 21px;
    }

    .form-section {
      border-top: 1px solid #f0dfb5;
      padding-top: 18px;
      margin-top: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 15px 0 7px;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #d4af37;
      border-radius: 8px;
      font: inherit;
    }

    textarea {
      min-height: 95px;
      resize: vertical;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .save-btn {
      background: #800020;
      color: #ffd700;
    }

    .reset-btn {
      background: #fff0c2;
      color: #390d1b;
    }

    .message {
      color: #176b38;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 18px;
      background: #390d1b;
      color: #ffd700;
      margin-top: 30px;
    }

    @media (max-width: 500px) {
      .profile-content {
        padding: 18px;
      }

      .stats {
        gap: 7px;
      }

      .stat {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h2>👑 TalentVora</h2>
    <nav>
      <a href="home.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="upload.html">Upload</a>
    </nav>
  </header>

  <main class="container">
    <div class="profile-card">

      <div class="cover"></div>

      <div class="profile-content">

        <img
          id="profilePhoto"
          class="avatar"
          alt="Profile photo"
          src="https://placehold.co/150x150/800020/FFD700?text=TV"
        >

        <h1 id="displayName">Your Name</h1>
        <p id="displayUsername" class="subtitle">@yourusername</p>
        <p id="displayBio">Welcome to my TalentVora profile!</p>
        <p><strong>Talent:</strong> <span id="displayTalent">Not selected</span></p>

        <div class="stats">
          <div class="stat">
            <strong>0</strong>
            Posts
          </div>
          <div class="stat">
            <strong>0</strong>
            Supporters
          </div>
          <div class="stat">
            <strong>0</strong>
            Following
          </div>
        </div>

        <div class="form-section">
          <h2>✏️ Edit Profile</h2>

          <form id="profileForm">

            <label for="photo">Profile Photo</label>
            <input type="file" id="photo" accept="image/*">
            <p class="subtitle">Choose a photo from your device.</p>

            <label for="name">Full Name</label>
            <input
              type="text"
              id="name"
              maxlength="60"
              placeholder="Enter your name"
              required
            >

            <label for="username">Username</label>
            <input
              type="text"
              id="username"
              maxlength="30"
              placeholder="Enter username"
              required
            >

            <label for="bio">Bio</label>
            <textarea
              id="bio"
              maxlength="250"
              placeholder="Tell the world about your talent"
            ></textarea>

            <label for="talent">Talent Category</label>
            <select id="talent">
              <option value="">Choose your talent</option>
              <option>Singing</option>
              <option>Dancing</option>
              <option>Drawing & Art</option>
              <option>Sports</option>
              <option>Acting</option>
              <option>Education</option>
              <option>Technology</option>
              <option>Other</option>
            </select>

            <div class="buttons">
              <button type="submit" class="save-btn">
                💾 Save Profile
              </button>

              <button type="reset" class="reset-btn">
                Reset Form
              </button>
            </div>

            <p id="message" class="message" role="status"></p>

          </form>
        </div>
      </div>
    </div>
  </main>

  <footer>
    © 2026 TalentVora | Show Your Talent to the World 🌍
  </footer>

  <script>
    const form = document.getElementById("profileForm");
    const photoInput = document.getElementById("photo");
    const photoDisplay = document.getElementById("profilePhoto");
    const message = document.getElementById("message");

    const fields = ["name", "username", "bio", "talent"];
    let photoData = "";

    function loadProfile() {
      const user = JSON.parse(
        localStorage.getItem("tvUser") || "null"
      ) || {};

      const profile = JSON.parse(
        localStorage.getItem("tvProfile") || "null"
      ) || {};

      document.getElementById("name").value =
        profile.name || user.name || "";

      document.getElementById("username").value =
        profile.username || "";

      document.getElementById("bio").value =
        profile.bio || "";

      document.getElementById("talent").value =
        profile.talent || "";

      if (profile.photo) {
        photoData = profile.photo;
        photoDisplay.src = photoData;
      }

      updatePreview();
    }

    function updatePreview() {
      const name = document.getElementById("name").value.trim();
      const username =
        document.getElementById("username").value.trim();
      const bio = document.getElementById("bio").value.trim();
      const talent = document.getElementById("talent").value;

      document.getElementById("displayName").textContent =
        name || "Your Name";

      document.getElementById("displayUsername").textContent =
        username ? "@" + username.replace(/^@/, "") : "@yourusername";

      document.getElementById("displayBio").textContent =
        bio || "Welcome to my TalentVora profile!";

      document.getElementById("displayTalent").textContent =
        talent || "Not selected";
    }

    fields.forEach(function(id) {
      document.getElementById(id).addEventListener(
        "input",
        updatePreview
      );
      document.getElementById(id).addEventListener(
        "change",
        updatePreview
      );
    });

    photoInput.addEventListener("change", function() {
      const file = photoInput.files[0];

      if (!file) return;

      if (!file.type.startsWith("image/")) {
        message.textContent = "Please select an image file.";
        photoInput.value = "";
        return;
      }

      if (file.size > 2 * 1024 * 1024) {
        message.textContent = "Please select an image under 2 MB.";
        photoInput.value = "";
        return;
      }

      const reader = new FileReader();

      reader.onload = function(event) {
        photoData = event.target.result;
        photoDisplay.src = photoData;
        message.textContent = "";
      };

      reader.readAsDataURL(file);
    });

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const user = JSON.parse(
        localStorage.getItem("tvUser") || "null"
      ) || {};

      const profile = {
        name: document.getElementById("name").value.trim(),
        username: document.getElementById("username").value
          .trim().replace(/^@/, ""),
        bio: document.getElementById("bio").value.trim(),
        talent: document.getElementById("talent").value,
        photo: photoData
      };

      try {
        localStorage.setItem("tvProfile", JSON.stringify(profile));

        // Update the demo user's display name as well.
        user.name = profile.name;
        localStorage.setItem("tvUser", JSON.stringify(user));

        message.textContent = "Profile saved successfully! ✨";
        updatePreview();
      } catch (error) {
        message.textContent =
          "Could not save the profile. Try a smaller photo.";
      }
    });

    form.addEventListener("reset", function() {
      setTimeout(function() {
        loadProfile();
        message.textContent = "";
      }, 0);
    });

    loadProfile();
  </script>

</body>
</html>
