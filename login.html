<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Log in - TalentVora</title>
<style>
:root{--ink:#1d2a2f;--paper:#f4f6f3;--card:#fff;--accent:#0f766e;--line:#d5dcd8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:1rem}
.box{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:2rem}
h1{margin:0 0 .25rem;font-size:1.6rem}
p.sub{margin:0 0 1.5rem;color:#51636a}
label{display:block;margin:0 0 1rem;font-size:.9rem;font-weight:600}
input{display:block;width:100%;margin-top:.35rem;padding:.7rem;border:1px solid var(--line);border-radius:8px;font:inherit}
input:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{width:100%;padding:.8rem;border:0;border-radius:8px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.msg{min-height:1.3rem;margin:.75rem 0 0;font-size:.9rem}
.msg.error{color:#b42318}.msg.ok{color:#067647}
.alt{margin-top:1rem;text-align:center;font-size:.9rem}
.alt a{color:var(--accent);font-weight:600}
</style>
</head>
<body>
  <main class="box">
    <h1>Welcome back</h1>
    <p class="sub">Log in to your TalentVora account.</p>
    <form id="loginForm">
      <label>Email<input type="email" id="email" autocomplete="email" required /></label>
      <label>Password<input type="password" id="password" autocomplete="current-password" required /></label>
      <button type="submit">Log in</button>
      <p id="message" class="msg" role="alert"></p>
    </form>
    <p class="alt">New here? <a href="register.html">Create an account</a></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="supabase-auth.js"></script>
  <script>document.getElementById("loginForm").addEventListener("submit", handleLogin);</script>
</body>
</html>
